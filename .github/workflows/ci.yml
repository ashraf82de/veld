name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: vet
        run: go vet ./...
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: test suite
        run: go test -race ./...
      - name: build
        run: go build -o veld ./cmd/veld
      - name: veld fmt --check
        run: ./veld fmt --check std examples evals testdata/semantics bench
      - name: veld test (std, examples, semantics)
        run: ./veld test std examples testdata/semantics
      - name: eval references
        run: |
          mkdir -p /tmp/refs
          for d in evals/tasks/*/; do cp "$d/reference.veld" "/tmp/refs/$(basename "$d").veld"; done
          ./veld eval evals/tasks /tmp/refs --json | tee /tmp/eval.json
          grep -q '"solved": '"$(ls -d evals/tasks/*/ | wc -l)" /tmp/eval.json
      - name: benchmarks (smoke)
        run: |
          for f in bench/*.veld; do
            timeout 60 ./veld run "$f" > /dev/null || { echo "$f failed or timed out"; exit 1; }
          done

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: test suite
        run: go test ./...
      - name: build and run
        shell: bash
        run: |
          go build -o veld.exe ./cmd/veld
          ./veld.exe fmt --check std examples evals testdata/semantics bench
          ./veld.exe test std examples testdata/semantics
