# Tag vX.Y.Z on main to publish binaries for Linux, macOS and Windows.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Verify
        run: |
          go vet ./...
          go test ./...
      - name: Build
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            ext=""; [ "$os" = windows ] && ext=".exe"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X main.version=$version" \
              -o "dist/veld-$os-$arch$ext" ./cmd/veld
          done
          (cd dist && sha256sum veld-* > SHA256SUMS)
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --title "Veld ${GITHUB_REF_NAME#v}"
